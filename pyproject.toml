[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "collar3cho-chipadapt_jd235"
version = "0.1.0"
description = "按结构键把条目聚类，标出推理芯片适配工程师·奖励模型的过拟合上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "collar3cho" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://collar3cho.github.io"
Repository = "https://github.com/collar3cho/chipadapt_jd235"
Issues = "https://github.com/collar3cho/chipadapt_jd235/issues"

[project.scripts]
chipadapt_jd235 = "chipadapt_jd235:main"

[tool.setuptools]
py-modules = ["chipadapt_jd235"]
